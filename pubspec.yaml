name: device_security_guard
description: Flutter security signals and policy helpers for rooted, jailbroken, hooked, debugged, emulated, repackaged, and unlocked devices.
version: 0.1.0
topics:
  - security
  - root-detection
  - jailbreak-detection
  - attestation
  - banking

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.vannghia.device_security_guard
        pluginClass: DeviceSecurityGuardPlugin
      ios:
        pluginClass: DeviceSecurityGuardPlugin
