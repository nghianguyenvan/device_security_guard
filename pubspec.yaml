name: device_security_guard
description: A Flutter plugin that reports local Android/iOS security signals for debugger, emulator, ADB, hooking, repackaging, root, jailbreak, and bootloader state.
version: 0.1.1
repository: https://github.com/nghianguyenvan/device_security_guard
issue_tracker: https://github.com/nghianguyenvan/device_security_guard/issues
topics:
  - security
  - root-detection
  - jailbreak-detection
  - banking

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.vannghia.device_security_guard
        pluginClass: DeviceSecurityGuardPlugin
      ios:
        pluginClass: DeviceSecurityGuardPlugin
